[package]
name = "OpenClip"
version = "0.1.0"
edition = "2024"
[[bin]]
name = "OpenClip"
path = "src/main.rs"

[[bin]]
name = "openclip_gui"
path = "src/bin/openclip_gui.rs"

[dependencies]
clipboard-rs = "0.3.4"
muda = "0.19.2"
tray-icon = "0.24.0"
eframe = "0.31.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
objc2-app-kit = "0.3.2"
objc2 = "0.6.4"
aes-gcm = "0.10.3"
rand = "0.10.1"
mimalloc = "0.1"
winit = "0.30"
image = "0.25.10"
lz4_flex = "0.13.1"

[profile.release]
opt-level = "s"      # Optimize for size (can reduce memory footprint)
lto = true           # Link Time Optimization (removes dead code, reduces size)
codegen-units = 1    # Better optimization across the whole program
panic = "abort"      # Remove unwind tables
strip = true         # Strip symbols
